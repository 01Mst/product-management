spring:

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true


jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-characters}
  expiration: ${JWT_EXPIRATION:900000}


app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}